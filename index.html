<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css?v=7">
</head>

<body>
    <!-- LOGIN -->
    <section id="login-section">
        <form id="login-form">
            <h1>My Profile</h1>
            <p class="subtitle">Sign in with your Zone01 account</p>

            <label for="identifier">Username or Email</label>
            <input type="text" id="identifier" autocomplete="username" placeholder="you@example.com">

            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">

            <button id="login-btn" type="submit">Log in</button>

            <p id="error-msg" role="alert"></p>
        </form>
    </section>

    <!-- PROFILE -->
    <section id="profile-section" hidden>

        <header class="topbar">
            <div class="identity">
                <h2 id="login">…</h2>
                <p id="fullname"></p>
            </div>
            <button id="logout-btn" type="button">Log out</button>
        </header>

        <div class="stats">
            <div class="stat"><span>Total XP</span><b id="xp">…</b></div>
            <div class="stat"><span>Level</span><b id="level">…</b></div>
            <div class="stat"><span>Audit ratio</span><b id="audit">…</b></div>
            <div class="stat"><span>Success rate</span><b id="success-rate">…</b></div>
        </div>

        <div class="grid">

            <div class="card">
                <h3>Identification</h3>
                <dl class="info">
                    <dt>User ID</dt><dd id="info-id">…</dd>
                    <dt>Login</dt><dd id="info-login">…</dd>
                    <dt>Full name</dt><dd id="info-name">…</dd>
                    <dt>Email</dt><dd id="info-email">…</dd>
                    <dt>Campus</dt><dd id="info-campus">…</dd>
                    <dt>Member since</dt><dd id="info-since">…</dd>
                </dl>
            </div>

            <div class="card">
                <h3>Projects PASS / FAIL</h3>
                <svg id="passfail-graph" viewBox="0 0 200 160" role="img"
                    aria-label="Passed and failed projects"></svg>
            </div>

            <div class="card wide">
                <h3>Audit ratio</h3>
                <svg id="audit-graph" viewBox="0 0 600 120" role="img" aria-label="XP done versus XP received"></svg>
            </div>

        </div>
    </section>

    <script src="auth.js?v=7"></script>
    <script src="querys.js?v=7"></script>
    <script src="svg.js?v=7"></script>
</body>

</html>
