<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- LOGIN -->
    <section id="login-section">
        <form id="login-form">
            <h1>My Profile</h1>

            <label for="identifier">Username or Email</label>
            <input type="text" id="identifier" autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password">

            <button id="login-btn" type="submit">Log in</button>

            <p id="error-msg"></p>
        </form>
    </section>

    <!-- PROFILE -->
    <section id="profile-section">

        <header class="topbar">
            <div id="avatar" class="avatar"></div>
            <div>
                <h2 id="login">…</h2>
                <p id="fullname"></p>
            </div>
            <button id="logout-btn">Log out</button>
        </header>

        <div class="stats">
            <div class="stat"><span>Total XP</span><b id="xp">…</b></div>
            <div class="stat"><span>Level</span><b id="level">…</b></div>
            <div class="stat"><span>Audit ratio</span><b id="audit">…</b></div>
            <div class="stat"><span>Success rate</span><b id="success-rate">…</b></div>
        </div>

        <div class="grid">

            <div class="card">
                <h3>Identification</h3>
                <p>User ID: <b id="info-id">…</b></p>
                <p>Login: <b id="info-login">…</b></p>
                <p>Full name: <b id="info-name">…</b></p>
                <p>Email: <b id="info-email">…</b></p>
                <p>Campus: <b id="info-campus">…</b></p>
                <p>Member since: <b id="info-since">…</b></p>
            </div>

            <div class="card">
                <h3>Projects PASS / FAIL</h3>
                <svg id="passfail-graph" viewBox="0 0 200 160"></svg>
            </div>

            <div class="card wide">
                <h3>XP over time</h3>
                <svg id="xp-graph" viewBox="0 0 600 200"></svg>
            </div>

        </div>
    </section>

    <script src="auth.js"></script>
    <script src="querys.js"></script>
    <script src="svg.js"></script>
</body>

</html>
